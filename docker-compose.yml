version: '3.8'

services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdftomd-studio
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - MAX_UPLOAD_SIZE=1073741824
      - BATCH_SIZE=5
    volumes:
      - ./data:/app/data
