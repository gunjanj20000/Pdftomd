<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bg)" stroke="#6366F1" stroke-width="6" stroke-opacity="0.7"/>
  <rect x="36" y="36" width="440" height="440" rx="86" fill="none" stroke="#818CF8" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Left page -->
  <rect x="130" y="145" width="115" height="215" rx="16" fill="#F8FAFC"/>
  <!-- Right page -->
  <rect x="267" y="145" width="115" height="215" rx="16" fill="#E2E8F0"/>
  <!-- Spine -->
  <rect x="240" y="145" width="32" height="215" fill="url(#accent)"/>

  <!-- Page lines left -->
  <rect x="155" y="185" width="70" height="8" rx="4" fill="#94A3B8"/>
  <rect x="155" y="225" width="70" height="8" rx="4" fill="#94A3B8"/>
  <rect x="155" y="265" width="70" height="8" rx="4" fill="#94A3B8"/>
  <rect x="155" y="305" width="50" height="8" rx="4" fill="#94A3B8"/>

  <!-- Page lines right -->
  <rect x="290" y="185" width="70" height="8" rx="4" fill="#94A3B8"/>
  <rect x="290" y="225" width="70" height="8" rx="4" fill="#94A3B8"/>
  <rect x="290" y="265" width="70" height="8" rx="4" fill="#94A3B8"/>
  <rect x="290" y="305" width="50" height="8" rx="4" fill="#94A3B8"/>

  <!-- Bookmark Ribbon -->
  <polygon points="246,125 266,125 266,195 256,180 246,195" fill="#EF4444"/>

  <!-- Badge Pill -->
  <rect x="156" y="385" width="200" height="45" rx="16" fill="url(#accent)" stroke="#C7D2FE" stroke-width="2" stroke-opacity="0.8"/>
  <text x="256" y="414" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PDF → MD</text>
</svg>
